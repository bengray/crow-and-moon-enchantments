# Builds the site and deploys it to Firebase Hosting.
#
# Runs when:
#   - something is pushed to main
#   - Nadine changes her Square catalog (the squareWebhook function sends a
#     "square-catalog-updated" repository_dispatch)
#   - someone clicks "Run workflow" on the Actions tab
#
# Square settings come from repository secrets and variables (SHOP-SETUP.md).
# Without SQUARE_ACCESS_TOKEN the build uses placeholder products.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [square-catalog-updated]
  workflow_dispatch:

# Editing ten products fires ten webhooks. Only the newest build matters.
concurrency:
  group: deploy-live
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_ENVIRONMENT: ${{ vars.SQUARE_ENVIRONMENT }}
          SQUARE_LOCATION_ID: ${{ vars.SQUARE_LOCATION_ID }}
          SHOP_HIDE_CATEGORY: ${{ vars.SHOP_HIDE_CATEGORY || 'Not Online' }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CROW_AND_MOON_ENCHANTMENTS }}
          channelId: live
          projectId: crow-and-moon-enchantments
